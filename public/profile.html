<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Cloud Concierge</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo"></div>
            </div>
        </div>
        <!-- Navbar -->
        <nav class="navbar">
            <div class="container">
                <div class="navbar-content">
                    <div class="logo">
                        <h2>Cloud Concierge</h2>
                    </div>
                    <ul class="nav-links">
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="profile.html">Profile</a></li>
                        <li><a href="index.html">Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="outer-container">
        <div class="signup-container">
            <h2>My Profile</h2>

            <div class="info-group">
                <span class="info-label">Email:</span>
                <span class="info-value" id="email">Loading...</span>
            </div>

            <div class="info-group">
                <span class="info-label">Restaurant:</span>
                <span class="info-value" id="restaurant">Loading...</span>
            </div>

            <div class="info-group">
                <span class="info-label">Postal Code:</span>
                <span class="info-value" id="postal">Loading...</span>
            </div>

            <!-- Buttons -->
            <div class="button-group"><br><br>
                <p>Enter your sales numbers and get your prediction!</p>
                <button class="btn btn-primary" onclick="location.href='csv.html'">Upload CSV</button>
                <button class="btn btn-primary" onclick="location.href='dashboard.html'">Enter Manually</button>
            </div>
        </div>
    </div>

    <script>
        function loadUserProfileFromLocalStorage() {
            const email = localStorage.getItem('email') || 'N/A';
            const restaurantName = localStorage.getItem('restaurantName') || 'N/A';
            const postalCode = localStorage.getItem('postalCode') || 'N/A';

            document.getElementById('email').textContent = email;
            document.getElementById('restaurant').textContent = restaurantName;
            document.getElementById('postal').textContent = postalCode;
        }

        document.addEventListener('DOMContentLoaded', loadUserProfileFromLocalStorage);
    </script>
</body>
</html>
